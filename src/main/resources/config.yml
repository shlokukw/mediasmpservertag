title: "SHARDSHOP - TAGS"
# where the tag shows next to the name: right = "Shlok [W]", left = "[W] Shlok"
tag-position: right
# how the tag shop talks to FrozenShards
shards:
  balance-placeholder: "%frozenshards_value%"
  take-command: "shards take %player% %amount%"
# one tag per line: display = item name, tag = chat prefix, price = shards
# 28 tags per page, extra pages are automatic
tags:
  W: {display: "<green><bold>W", tag: "<dark_gray>[<green><bold>W</bold><dark_gray>]", price: 5000}
